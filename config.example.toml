# VibeTTS configuration. Copied to config.toml on first run; edit config.toml.

[hotkey]
# Press to read the selected text aloud; press again (or Esc) to stop.
# Names: ctrl ctrl_l ctrl_r alt alt_l alt_r shift win caps_lock space f1..f24 a..z
# Chords are joined with "+", e.g. "ctrl+shift+r". Single keys work too: "f9".
read = "alt+win"

[speech]
model = "models/kokoro-v1.0.int8.onnx"   # or models/kokoro-v1.0.onnx (fp32, 3.5x larger)
voices = "models/voices-v1.0.bin"
speed = 1.0                  # 0.5 .. 2.0
sentence_pause = 0.25        # seconds of silence between sentences
volume = 1.0                 # 0 .. 1
device = ""                  # "" = Windows default output; or part of the device name
preload = true               # load the model at startup so the first read starts at once
# Which language is read: "auto" detects the language of each read and uses that language's
# voice; or a language code (e.g. "hr") to always read in that language.
read_language = "auto"
supertonic_dir = "models/supertonic-3"  # Supertonic model files (downloaded from Settings)
supertonic_steps = 8                 # 4 .. 16: fewer = faster, more = better quality

# One voice per language (31 languages). A voice is a Kokoro id (Kokoro reads en es fr hi it pt:
# af_* am_* bf_* bm_* ef_* em_* ff_* hf_* hm_* if_* im_* pf_* pm_*), "supertonic:F1" .. "supertonic:M5"
# (Supertonic 3 reads all 31; download it in Settings), or "" = Off (never detected or read).
# Languages missing from this table use "supertonic:F1" (English: "af_heart").
[speech.language_voices]
en = "af_heart"
hr = "supertonic:F1"
# es = "ef_dora"             # Spanish with Kokoro instead
# de = "supertonic:M1"
# ru = ""                    # Off

[selection]
copy_timeout_ms = 400        # how long to wait for the app to answer the copy shortcut
fallback_to_clipboard = true # nothing selected: read the clipboard text instead
restore_clipboard = true     # put the previous clipboard content back after copying
clean_markdown = true        # skip markdown symbols, say "link" for web addresses
max_chars = 20000            # longer selections are cut; 0 = no limit

[ui]
show_pill = true
pill_position = "bottom"     # bottom | top
show_settings_on_start = true

[export]
folder = ""                  # "" = Documents/VibeTTS; relative paths are next to the app
format = "mp3"               # mp3 (small) | wav (lossless)
mp3_bitrate = 64             # 32 | 48 | 64 | 96 | 128 | 160 | 192 | 256 | 320 kbps

[mcp]
enabled = false              # local MCP server so AI agents can export audio (opt-in)
port = 7723                  # 1024 .. 65535, listens on 127.0.0.1 only
max_chars = 200000           # longest text one tool call may read; 0 = no limit

[reader]
enabled = true               # local book reader and Chrome extension API (127.0.0.1 only)
port = 7724                  # 1024 .. 65535
library_folder = "library"   # imported books; relative paths are next to the app
max_chars = 500000           # longest text one read request may carry; 0 = no limit
# Chrome extensions allowed to call the API (the id shown on chrome://extensions).
# The default is the id of the extension in the "extension" folder.
extension_ids = ["injaiiefkhoimpkeandbjfbnnjddaceh"]
