[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetts"
dynamic = ["version"]
description = "Read selected text aloud on Windows with a local Kokoro voice"
requires-python = ">=3.11"
dependencies = [
    "pynput",
    "sounddevice",
    "numpy",
    "pystray",
    "Pillow",
    "pywin32",
    "requests",
    "tomli-w",
    "sv-ttk",
    "kokoro-onnx",
    "pypdf>=4",
    "lameenc>=1.7",
]

[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]

[project.scripts]
vibetts = "vibetts.app:main"

[tool.setuptools]
packages = ["vibetts"]

[tool.setuptools.dynamic]
version = { attr = "vibetts.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
