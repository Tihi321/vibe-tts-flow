<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeTTS Reader</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var t = (JSON.parse(localStorage.getItem("vibetts.reader") || "{}") || {}).theme;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="banner" class="banner" role="status" hidden></div>

<!-- Library -->
<div id="view-library" class="view" hidden>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>VibeTTS <span class="brand-sub">Reader</span></a>
    <button type="button" class="icon-btn theme-btn" aria-label="Theme: system" title="Theme: system"></button>
  </header>
  <main class="library">
    <h1 class="lib-title">Your library</h1>
    <div id="dropzone" class="dropzone" tabindex="-1">
      <p class="dz-main" id="dz-text">Drop a book here</p>
      <p class="dz-sub">EPUB, TXT, Markdown, HTML, DOCX or PDF</p>
      <button type="button" id="pick-btn" class="btn">Choose a file</button>
      <input type="file" id="file-input" multiple hidden accept=".epub,.txt,.md,.markdown,.html,.htm,.docx,.pdf">
    </div>
    <p id="lib-msg" class="msg" role="alert" hidden></p>
    <ul id="book-list" class="book-list"></ul>
    <p id="lib-empty" class="empty" hidden>No books yet. Add one above to start listening.</p>
  </main>
</div>

<!-- Reader -->
<div id="view-reader" class="view" hidden>
  <div class="sticky-head">
    <header class="topbar">
      <button type="button" id="toc-toggle" class="icon-btn toc-toggle" aria-label="Show chapters" aria-expanded="false" aria-controls="toc"></button>
      <a class="icon-btn back-btn" href="#/" aria-label="Back to library" title="Library"></a>
      <div class="book-heading"><span id="book-title" class="book-title"></span><span id="book-author" class="book-author"></span></div>
      <span class="spacer"></span>
      <button type="button" id="font-dec" class="icon-btn txt-btn" aria-label="Smaller text" title="Smaller text"><span style="font-size:.8em">A</span></button>
      <button type="button" id="font-inc" class="icon-btn txt-btn" aria-label="Larger text" title="Larger text"><span style="font-size:1.2em">A</span></button>
      <button type="button" class="icon-btn theme-btn" aria-label="Theme: system" title="Theme: system"></button>
    </header>
    <div class="controls" role="toolbar" aria-label="Playback">
      <div class="transport">
        <button type="button" id="prev-chap" class="icon-btn" aria-label="Previous chapter" title="Previous chapter"></button>
        <button type="button" id="prev-sent" class="icon-btn" aria-label="Previous sentence" title="Previous sentence (Left arrow)"></button>
        <button type="button" id="play" class="icon-btn play-btn" aria-label="Play" title="Play (Space)"></button>
        <button type="button" id="stop" class="icon-btn" aria-label="Stop" title="Stop (Escape)"></button>
        <button type="button" id="next-sent" class="icon-btn" aria-label="Next sentence" title="Next sentence (Right arrow)"></button>
        <button type="button" id="next-chap" class="icon-btn" aria-label="Next chapter" title="Next chapter"></button>
      </div>
      <div class="options">
        <label class="opt"><span>Voice</span>
          <select id="voice"><option value="">Auto</option></select></label>
        <label class="opt"><span>Language</span>
          <select id="lang"><option value="">Auto</option></select></label>
        <label class="opt opt-speed"><span>Speed <output id="speed-out">1.00x</output></span>
          <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1"></label>
      </div>
    </div>
    <p id="elsewhere" class="note" hidden>Playing elsewhere. Press play to read this book here instead.</p>
    <p id="reader-msg" class="msg" role="alert" hidden></p>
  </div>
  <div class="reader-layout">
    <aside id="toc" class="toc" aria-label="Chapters">
      <h2 class="toc-head">Chapters</h2>
      <ol id="toc-list" class="toc-list"></ol>
    </aside>
    <div id="toc-scrim" class="scrim"></div>
    <main class="page">
      <article id="chapter" class="chapter" aria-live="off"></article>
      <nav id="chapter-nav" class="chapter-nav" hidden>
        <button type="button" id="foot-prev" class="btn btn-quiet">Previous chapter</button>
        <button type="button" id="foot-next" class="btn btn-quiet">Next chapter</button>
      </nav>
    </main>
  </div>
</div>

<script src="segment.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
